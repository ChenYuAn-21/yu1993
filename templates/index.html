{% extends "base.html" %}
{% block content %}

<!-- KPI -->
<section class="grid kpi-grid">
  <div class="card kpi-card theme-1">
    <div class="kpi-title">🧸 儲蓄率</div>
    <div class="kpi-value" id="kpiSavingsRate">--</div>
  </div>
  <div class="card kpi-card theme-2">
    <div class="kpi-title">📈 投資報酬率（當月）</div>
    <div class="kpi-value" id="kpiROI">--</div>
  </div>
  <div class="card kpi-card theme-3">
    <div class="kpi-title">💁 月現金流</div>
    <div class="kpi-value" id="kpiCashFlow">--</div>
  </div>
  <div class="card kpi-card theme-4">
    <div class="kpi-title">🌼 資產總額</div>
    <div class="kpi-value" id="kpiAssets">--</div>
  </div>
</section>

<!-- 圖表 -->
<section class="grid charts-grid">
  <div class="card theme-5">
    <h3>📅 收入 / 支出 / 結餘（月度）</h3>
    <canvas id="lineMonthly"></canvas>
  </div>
  <div class="card theme-6">
    <h3>🍰 支出分類（圓餅圖）</h3>
    <canvas id="pieExpense"></canvas>
  </div>
  <div class="card theme-7">
    <h3>🧭 消費雷達圖（本月）</h3>
    <canvas id="radarExpense"></canvas>
  </div>
</section>

<!-- 追蹤 -->
<section class="card theme-8">
  <h3>📌 財務追蹤</h3>
  <table class="table">
    <thead>
      <tr>
        <th>項目</th><th>本月花費</th><th>預算</th><th>達成率</th>
      </tr>
    </thead>
    <tbody id="trackerBody"></tbody>
  </table>
</section>

<!-- 交易清單 -->
<section class="card theme-9">
  <div class="flex-between">
    <h3>🗒️ 交易清單</h3>
    <button id="addTxnBtn" class="btn primary">＋ 新增交易</button>
  </div>
  <div class="table-scroll">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th><th>日期</th><th>類型</th><th>類別</th><th>金額</th><th>明細</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="txnBody"></tbody>
    </table>
  </div>
</section>

<!-- 其餘（Modal等）保持不變 -->
{% endblock %}
