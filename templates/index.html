{% extends "base.html" %}
{% block content %}

<!-- KPI -->
<section class="grid kpi-grid">
  <div class="card">
    <div class="kpi-title">儲蓄率</div>
    <div class="kpi-value" id="kpiSavingsRate">--</div>
  </div>
  <div class="card">
    <div class="kpi-title">投資報酬率（當月，投資部位）</div>
    <div class="kpi-value" id="kpiROI">--</div>
  </div>
  <div class="card">
    <div class="kpi-title">月現金流</div>
    <div class="kpi-value" id="kpiCashFlow">--</div>
  </div>
  <div class="card">
    <div class="kpi-title">資產總額</div>
    <div class="kpi-value" id="kpiAssets">--</div>
  </div>
</section>

<!-- 圖表 -->
<section class="grid charts-grid">
  <div class="card">
    <h3>收入 / 支出 / 結餘（月度）</h3>
    <canvas id="lineMonthly"></canvas>
  </div>
  <div class="card">
    <h3>支出分類（圓餅圖）</h3>
    <canvas id="pieExpense"></canvas>
  </div>
  <div class="card">
    <h3>投資組合分配（長條圖）</h3>
    <canvas id="barPortfolio"></canvas>
  </div>
</section>

<!-- 追蹤 -->
<section class="card">
  <h3>財務追蹤</h3>
  <table class="table">
    <thead>
      <tr>
        <th>項目</th><th>本月花費</th><th>預算</th><th>達成率</th>
      </tr>
    </thead>
    <tbody id="trackerBody"></tbody>
  </table>
</section>

<!-- 浮動新增交易按鈕 -->
<button id="addTxnBtn" class="fab">＋ 新增交易</button>

<!-- 新增交易 Modal -->
<div id="txnModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>新增交易</h3>
      <button id="modalClose" class="icon-btn" aria-label="close">✕</button>
    </div>
    <form id="txnForm" class="form">
      <div class="row">
        <label>收支類型</label>
        <select name="type" required>
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
      </div>
      <div class="row">
        <label>日期</label>
        <input type="date" name="date" required />
      </div>
      <div class="row">
        <label>類別</label>
        <select name="category" required>
          <option value="食物">食物</option>
          <option value="交通">交通</option>
          <option value="購物">購物</option>
          <option value="娛樂">娛樂</option>
          <option value="日用品">日用品</option>
          <option value="投資">投資</option>
          <option value="訂閱服務">訂閱服務</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="row">
        <label>交易明細</label>
        <input type="text" name="note" placeholder="例如：午餐、衣服、ETF 手續費..." />
      </div>
      <div class="row">
        <label>金額</label>
        <input type="number" step="0.01" name="amount" required />
      </div>
      <div class="modal-actions">
        <button type="button" id="cancelBtn" class="btn ghost">取消</button>
        <button type="submit" class="btn primary">新增</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  const monthSelect = document.getElementById('monthSelect');
  let lineChart, pieChart, barChart;

  async function fetchJSON(url, opts){
    const res = await fetch(url, opts);
    return res.json();
  }

  // 初始化月份
  async function initMonths() {
    const months = await fetchJSON('/api/months');
    monthSelect.innerHTML = months.map((m, idx) =>
      `<option value="${m}" ${idx===months.length-1 ? 'selected':''}>${m}</option>`
    ).join('');
    updateAll();
  }

  async function updateAll(){
    const m = monthSelect.value;
    await Promise.all([
      updateKPIs(m),
      updateLine(),
      updatePie(m),
      updateBar(m),
      updateTrackers(m),
    ]);
  }

  async function updateKPIs(month){
    const data = await fetchJSON(`/api/kpis?month=${month}`);
    document.getElementById('kpiSavingsRate').textContent =
      (data.savings_rate != null) ? (data.savings_rate*100).toFixed(1)+'%' : '--';
    document.getElementById('kpiROI').textContent =
      (data.monthly_roi != null) ? (data.monthly_roi*100).toFixed(2)+'%' : '—';
    document.getElementById('kpiCashFlow').textContent =
      (data.cash_flow != null) ? data.cash_flow.toLocaleString() : '--';
    document.getElementById('kpiAssets').textContent =
      (data.assets_total != null) ? data.assets_total.toLocaleString() : '--';
  }

  async function updateLine(){
    const rows = await fetchJSON('/api/line_income_expense_balance');
    const labels = rows.map(r => r.month);
    const income = rows.map(r => r.income);
    const expense = rows.map(r => r.expense);
    const balance = rows.map(r => r.balance);

    const ctx = document.getElementById('lineMonthly').getContext('2d');
    if(lineChart) lineChart.destroy();
    lineChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: '收入', data: income },
          { label: '支出', data: expense },
          { label: '結餘', data: balance },
        ]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  async function updatePie(month){
    const res = await fetchJSON(`/api/pie_expense_by_category?month=${month}`);
    const labels = res.data.map(x => x.category);
    const amounts = res.data.map(x => x.amount);
    const ctx = document.getElementById('pieExpense').getContext('2d');
    if(pieChart) pieChart.destroy();
    pieChart = new Chart(ctx, {
      type: 'pie',
      data: { labels, datasets: [{ data: amounts }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  async function updateBar(month){
    const res = await fetchJSON(`/api/bar_portfolio_allocation?month=${month}`);
    const labels = res.data.map(x => x.asset_class.toUpperCase());
    const values = res.data.map(x => x.market_value);
    const ctx = document.getElementById('barPortfolio').getContext('2d');
    if(barChart) barChart.destroy();
    barChart = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ label: `${res.month} 市值`, data: values }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  async function updateTrackers(month){
    const res = await fetchJSON(`/api/trackers?month=${month}`);
    const rows = res.data.map(r => {
      const rate = (r.progress != null) ? (r.progress*100).toFixed(1)+'%' : '--';
      return `<tr>
        <td>${r.name}</td>
        <td>${r.spent.toLocaleString()}</td>
        <td>${r.budget.toLocaleString()}</td>
        <td>${rate}</td>
      </tr>`;
    }).join('');
    document.getElementById('trackerBody').innerHTML = rows || `<tr><td colspan="4">本月無資料</td></tr>`;
  }

  // -------- 新增交易 Modal --------
  const addBtn = document.getElementById('addTxnBtn');
  const modal = document.getElementById('txnModal');
  const modalClose = document.getElementById('modalClose');
  const cancelBtn = document.getElementById('cancelBtn');
  const form = document.getElementById('txnForm');

  function openModal(){ modal.classList.remove('hidden'); }
  function closeModal(){ modal.classList.add('hidden'); form.reset(); }

  addBtn.addEventListener('click', openModal);
  modalClose.addEventListener('click', closeModal);
  cancelBtn.addEventListener('click', closeModal);
  window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });
  window.addEventListener('click', (e)=>{ if(e.target===modal) closeModal(); });

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const payload = {
      type: fd.get('type'),
      date: fd.get('date'),
      category: fd.get('category'),
      note: fd.get('note') || '',
      amount: fd.get('amount')
    };
    const res = await fetchJSON('/api/transactions', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(res.ok){
      closeModal();
      // 更新月份下拉（避免新月份沒出現在圖上）
      await initMonths();
    }else{
      alert(res.error || '新增失敗');
    }
  });

  monthSelect.addEventListener('change', updateAll);
  initMonths();
</script>
{% endblock %}
